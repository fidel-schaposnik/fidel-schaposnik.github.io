version: 2
updates:
  # Ruby gems (Jekyll + plugins)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      jekyll-plugins:
        patterns:
          - "*"

  # GitHub Actions used in workflows (keeps pinned SHAs updated)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
